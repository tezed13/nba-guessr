<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>NBA Spin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #fff; }
        .clue-card { transition: all 0.4s ease; }
        .clue-hidden { filter: blur(8px); opacity: 0.2; user-select: none; }
        .clue-revealed { filter: none; opacity: 1; }
    </style>
</head>
<body class="min-h-screen p-6 flex flex-col items-center">
    <nav class="w-full max-w-2xl mb-6 text-left">
        <a href="/" class="text-gray-400 hover:text-white font-bold transition">← Back to Menu</a>
    </nav>

    <h1 class="text-5xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500 italic uppercase">NBA SPIN</h1>
    <p class="text-gray-500 text-xs tracking-widest mb-8 uppercase">Guess the season stat leader</p>

    <!-- Clue Cards -->
    <div class="grid grid-cols-2 gap-4 w-full max-w-2xl mb-8">

        <!-- Always visible -->
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 text-center col-span-2">
            <p class="text-gray-500 text-xs uppercase font-bold tracking-widest mb-1">Category & Value</p>
            <p id="clue-stat" class="text-2xl font-black text-yellow-400 clue-card clue-hidden">—</p>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 text-center">
            <p class="text-gray-500 text-xs uppercase font-bold tracking-widest mb-1">Season</p>
            <p id="clue-season" class="text-2xl font-black text-white clue-card clue-hidden">—</p>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 text-center">
            <p class="text-gray-500 text-xs uppercase font-bold tracking-widest mb-1">Position</p>
            <p id="clue-pos" class="text-2xl font-black text-white clue-card clue-hidden">—</p>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 text-center col-span-2">
            <p class="text-gray-500 text-xs uppercase font-bold tracking-widest mb-1">Conference</p>
            <p id="clue-conf" class="text-2xl font-black text-white clue-card clue-hidden">—</p>
        </div>
    </div>

    <!-- Reveal buttons -->
    <div id="revealBtns" class="flex gap-3 flex-wrap justify-center mb-6 hidden">
        <button onclick="revealClue('clue-season')" class="bg-gray-800 hover:bg-gray-700 text-white font-bold px-4 py-2 rounded-xl text-sm transition">Reveal Season</button>
        <button onclick="revealClue('clue-pos')" class="bg-gray-800 hover:bg-gray-700 text-white font-bold px-4 py-2 rounded-xl text-sm transition">Reveal Position</button>
        <button onclick="revealClue('clue-conf')" class="bg-gray-800 hover:bg-gray-700 text-white font-bold px-4 py-2 rounded-xl text-sm transition">Reveal Conference</button>
    </div>

    <!-- Guess area -->
    <div class="w-full max-w-2xl bg-gray-900 p-6 rounded-3xl border border-gray-800">
        <div class="relative mb-4">
            <input type="text" id="guessInput" placeholder="Name the player..."
                   class="w-full bg-black border-2 border-gray-800 rounded-xl p-4 focus:border-yellow-500 outline-none text-lg font-bold text-white transition-all"
                   disabled>
            <div id="suggestions" class="absolute z-10 w-full border border-gray-800 rounded-xl mt-1 bg-gray-900 max-h-48 overflow-y-auto hidden"></div>
        </div>

        <div class="flex gap-3">
            <button id="submitBtn" class="flex-1 bg-yellow-500 hover:bg-yellow-400 text-black font-black py-4 rounded-xl transition-all" disabled>SUBMIT</button>
            <button id="nextBtn" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-black py-4 rounded-xl transition-all hidden">NEXT SPIN</button>
        </div>

        <div id="resultArea" class="mt-5 text-center min-h-[50px]">
            <p id="resultMsg" class="text-2xl font-black italic uppercase"></p>
            <p id="correctName" class="text-gray-400 mt-1 font-bold"></p>
        </div>

        <div class="mt-4 flex justify-center">
            <div class="bg-black border border-gray-800 px-8 py-3 rounded-full font-black">
                🔥 STREAK: <span id="streakVal" class="text-yellow-500 text-xl">0</span>
            </div>
        </div>
    </div>

    <!-- Loading overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 hidden">
        <p class="text-yellow-400 text-2xl font-black animate-pulse uppercase tracking-widest">Loading...</p>
    </div>

    <script>
        let currentWinner = "";
        let streak = parseInt(localStorage.getItem('spin_cur') || '0');
        let bestStreak = parseInt(localStorage.getItem('spin_best') || '0');
        let playerNames = [];

        fetch("/all_players").then(r => r.json()).then(d => playerNames = d);

        function setLoading(on) {
            document.getElementById('loadingOverlay').classList.toggle('hidden', !on);
        }

        function revealClue(id) {
            const el = document.getElementById(id);
            el.classList.remove('clue-hidden');
            el.classList.add('clue-revealed');
        }

        async function loadSpin() {
            // Reset UI
            currentWinner = "";
            document.getElementById('guessInput').value = "";
            document.getElementById('guessInput').disabled = true;
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('submitBtn').classList.remove('hidden');
            document.getElementById('nextBtn').classList.add('hidden');
            document.getElementById('resultMsg').textContent = "";
            document.getElementById('correctName').textContent = "";
            document.getElementById('revealBtns').classList.add('hidden');
            document.getElementById('suggestions').classList.add('hidden');

            // Hide all clues
            ['clue-stat','clue-season','clue-pos','clue-conf'].forEach(id => {
                const el = document.getElementById(id);
                el.textContent = "—";
                el.classList.add('clue-hidden');
                el.classList.remove('clue-revealed');
            });

            setLoading(true);

            try {
                const res = await fetch('/spin_data');
                if (!res.ok) throw new Error("Server error");
                const data = await res.json();

                // Set all clue text from real data
                document.getElementById('clue-stat').textContent  = `${data.clues.stat_name}: ${data.clues.stat_val}`;
                document.getElementById('clue-season').textContent = data.clues.season;
                document.getElementById('clue-pos').textContent    = data.clues.pos;
                document.getElementById('clue-conf').textContent   = data.clues.conf;

                // Store winner only after data is confirmed
                currentWinner = data.winner;

                // Reveal stat immediately, blur the rest
                revealClue('clue-stat');
                document.getElementById('revealBtns').classList.remove('hidden');

                // Unlock input
                document.getElementById('guessInput').disabled = false;
                document.getElementById('submitBtn').disabled = false;

            } catch (err) {
                console.error(err);
                document.getElementById('clue-stat').textContent = "Error loading — try again";
                revealClue('clue-stat');
            } finally {
                setLoading(false);
            }
        }

        document.getElementById('submitBtn').onclick = () => {
            if (!currentWinner) return;
            const guess = document.getElementById('guessInput').value.trim();
            const msg = document.getElementById('resultMsg');

            if (guess.toLowerCase() === currentWinner.toLowerCase()) {
                streak++;
                if (streak > bestStreak) {
                    bestStreak = streak;
                    localStorage.setItem('spin_best', bestStreak);
                }
                localStorage.setItem('spin_cur', streak);
                msg.textContent = `✅ SWISH! Streak: ${streak} (Best: ${bestStreak})`;
                msg.className = "text-2xl font-black italic text-green-500 uppercase";
                document.getElementById('correctName').textContent = "";
            } else {
                streak = 0;
                localStorage.setItem('spin_cur', 0);
                msg.textContent = "❌ AIRBALL!";
                msg.className = "text-2xl font-black italic text-red-500 uppercase";
                document.getElementById('correctName').textContent = `Answer: ${currentWinner} — Best: ${bestStreak}`;
            }

            // Reveal all remaining clues on submit
            ['clue-season','clue-pos','clue-conf'].forEach(revealClue);
            document.getElementById('revealBtns').classList.add('hidden');
            document.getElementById('streakVal').textContent = streak;
            document.getElementById('submitBtn').classList.add('hidden');
            document.getElementById('nextBtn').classList.remove('hidden');
        };

        // Autocomplete
        const input = document.getElementById('guessInput');
        const suggs = document.getElementById('suggestions');
        input.addEventListener('input', () => {
            const q = input.value.toLowerCase().trim();
            if (q.length < 2) { suggs.classList.add('hidden'); return; }
            const matches = playerNames.filter(n => n.toLowerCase().includes(q)).slice(0, 8);
            if (!matches.length) { suggs.classList.add('hidden'); return; }
            suggs.innerHTML = matches.map(n => `
                <div class="p-3 hover:bg-gray-800 cursor-pointer border-b border-gray-800 text-white font-bold"
                     onclick="selectName('${n.replace(/'/g, "\\'")}')">
                    ${n}
                </div>`).join('');
            suggs.classList.remove('hidden');
        });

        function selectName(n) {
            input.value = n;
            suggs.classList.add('hidden');
        }

        document.getElementById('nextBtn').onclick = loadSpin;
        window.onload = loadSpin;
    </script>
</body>
</html>
