<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB Guessr — Ball Knowledge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; font-family: 'Inter', sans-serif; background: #0d0d0f; color: #fff; overflow: hidden; }

        #app { display:flex; flex-direction:column; height:100dvh; max-width:680px; margin:0 auto; padding:0 16px; }

        #topbar { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:14px 0 10px; border-bottom:1px solid #1c1c1f; }

        #statsArea { flex:1; overflow-y:auto; padding:12px 0 8px; scrollbar-width:thin; scrollbar-color:#27272a transparent; }
        #statsArea::-webkit-scrollbar { width:4px; }
        #statsArea::-webkit-scrollbar-thumb { background:#27272a; border-radius:4px; }

        #guessPanel { flex-shrink:0; border-top:1px solid #1c1c1f; padding:12px 0 16px; background:#0d0d0f; }

        /* Leaderboard drawer */
        .side-drawer { position:fixed; inset:0; z-index:50; display:flex; align-items:flex-end; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); opacity:0; pointer-events:none; transition:opacity 0.25s; }
        .side-drawer.open { opacity:1; pointer-events:all; }
        .drawer-content { width:100%; max-width:680px; margin:0 auto; background:#111113; border:1px solid #27272a; border-radius:20px 20px 0 0; padding:24px 20px 36px; transform:translateY(100%); transition:transform 0.28s cubic-bezier(.4,0,.2,1); max-height:85dvh; overflow-y:auto; }
        .side-drawer.open .drawer-content { transform:translateY(0); }

        .lb-tabs { display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; scrollbar-width:none; }
        .lb-tabs::-webkit-scrollbar { display:none; }
        .lb-tab { flex-shrink:0; padding:6px 14px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; border:1.5px solid #27272a; background:transparent; color:#52525b; font-family:inherit; transition:all 0.15s; }
        .lb-tab.active { background:#16a34a; border-color:#16a34a; color:#fff; }
        .lb-tab:hover:not(.active) { border-color:#3f3f46; color:#a1a1aa; }
        .lb-table { width:100%; border-collapse:collapse; }
        .lb-table thead th { background:#18181b; color:#52525b; font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; padding:9px 12px; border-bottom:1px solid #27272a; text-align:left; }
        .lb-table tbody tr { border-bottom:1px solid #1c1c1f; }
        .lb-table tbody tr:last-child { border-bottom:none; }
        .lb-table tbody td { padding:10px 12px; font-size:13px; color:#a1a1aa; }
        .lb-table tbody td.rank { color:#52525b; font-weight:700; width:32px; }
        .lb-table tbody td.name-cell { color:#e4e4e7; font-weight:700; }
        .lb-table tbody td.score-cell { color:#16a34a; font-weight:800; text-align:right; font-size:15px; }
        .lb-table tbody tr.you-row td { color:#fbbf24; }
        .lb-table tbody tr.you-row td.score-cell { color:#fbbf24; }
        .rank-gold { color:#fbbf24 !important; } .rank-silver { color:#a1a1aa !important; } .rank-bronze { color:#b45309 !important; }
        .lb-empty { text-align:center; padding:40px 20px; color:#3f3f46; font-size:13px; font-weight:600; }
        .lb-meta { font-size:11px; color:#3f3f46; font-weight:600; margin-bottom:14px; padding:8px 12px; background:#18181b; border-radius:8px; border:1px solid #1c1c1f; }
        #nameEntrySection { background:#18181b; border:1px solid #27272a; border-radius:12px; padding:16px; margin-bottom:16px; display:none; }
        #nameEntrySection.visible { display:block; }

        /* Stat table */
        .stat-table { width:100%; border-collapse:collapse; }
        .stat-table thead th { background:#18181b; color:#52525b; font-size:10px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; padding:9px 12px; border-bottom:1px solid #27272a; position:sticky; top:0; z-index:1; }
        .stat-table tbody tr { border-bottom:1px solid #1c1c1f; }
        .stat-table tbody tr:last-child { border-bottom:none; }
        .stat-table tbody tr:hover { background:#18181b; }
        .stat-table tbody td { padding:9px 12px; font-size:13px; color:#a1a1aa; }
        .stat-table tbody td.hi  { color:#4ade80; font-weight:700; }
        .stat-table tbody td.yr  { color:#52525b; font-weight:600; }
        .stat-table tbody td.tm  { color:#e4e4e7; font-weight:600; }

        .dark-input { background:#18181b; border:1.5px solid #27272a; border-radius:10px; color:#fff; font-size:15px; font-weight:600; padding:12px 14px; width:100%; outline:none; transition:border-color 0.2s; font-family:inherit; }
        .dark-input:focus { border-color:#16a34a; }
        .dark-input::placeholder { color:#3f3f46; }

        #suggestions { position:absolute; z-index:30; width:100%; background:#18181b; border:1.5px solid #27272a; border-radius:10px; bottom:calc(100% + 6px); top:auto; overflow-y:auto; max-height:320px; }
        .sug-item { padding:10px 14px; font-size:14px; font-weight:600; color:#d4d4d8; cursor:pointer; border-bottom:1px solid #27272a; }
        .sug-item:last-child { border-bottom:none; }
        .sug-item:hover { background:#16a34a; color:#fff; }

        .btn { border:none; border-radius:10px; font-family:inherit; font-weight:800; font-size:14px; letter-spacing:0.04em; text-transform:uppercase; cursor:pointer; padding:12px 16px; transition:background 0.15s, transform 0.1s; }
        .btn:active { transform:scale(0.97); }
        .btn-green { background:#16a34a; color:#fff; }
        .btn-green:hover { background:#15803d; }
        .btn-dim   { background:#27272a; color:#a1a1aa; }
        .btn-dim:hover { background:#3f3f46; color:#fff; }
        .btn-icon  { background:#18181b; border:1px solid #27272a; border-radius:8px; padding:7px 10px; cursor:pointer; font-size:16px; line-height:1; }
        .btn-icon:hover { background:#27272a; }

        .attempt-dot { width:10px; height:10px; border-radius:50%; border:1.5px solid #3f3f46; display:inline-block; transition:background 0.2s, border-color 0.2s; }
        .attempt-dot.used-wrong { background:#f87171; border-color:#f87171; }
        .attempt-dot.used-right { background:#4ade80; border-color:#4ade80; }

        .banner { border-radius:10px; padding:12px 16px; font-weight:800; font-size:14px; text-align:center; }
        .banner-ok   { background:#052e16; border:1px solid #166534; color:#4ade80; }
        .banner-err  { background:#450a0a; border:1px solid #991b1b; color:#f87171; }
        .banner-hint { background:#1c1917; border:1px solid #44403c; color:#d6d3d1; }

        .streak-pill { background:#18181b; border:1px solid #27272a; border-radius:999px; padding:5px 14px; font-size:13px; font-weight:700; color:#52525b; display:flex; align-items:center; gap:6px; }
        .streak-pill span { color:#16a34a; font-size:16px; font-weight:900; }

        .era-chip-game { padding:3px 9px; border-radius:6px; border:1.5px solid #27272a; background:transparent; color:#52525b; font-family:inherit; font-size:10px; font-weight:700; cursor:pointer; transition:all 0.15s; letter-spacing:0.04em; }
        .era-chip-game.on { border-color:#16a34a; background:#052e16; color:#4ade80; }
        .era-chip-game:hover:not(.on) { border-color:#3f3f46; color:#a1a1aa; }

        #playerNameDisplay { font-size:13px; font-weight:800; letter-spacing:0.05em; color:#3f3f46; }
        @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:.8} }
        .skeleton { animation:pulse 1.2s ease-in-out infinite; background:#18181b; border-radius:4px; display:inline-block; width:100%; height:14px; }
        @keyframes scorePop { 0%{transform:scale(1)} 40%{transform:scale(1.18);color:#4ade80} 100%{transform:scale(1)} }
        .score-pop { animation:scorePop 0.4s ease; }
    </style>
</head>
<body>
    <input type="hidden" id="startSeason" value="{{ start_season }}">
    <input type="hidden" id="endSeason"   value="{{ end_season }}">
    <input type="hidden" id="types"       value="{{ types }}">

    <!-- LEADERBOARD DRAWER -->
    <div id="lbDrawer" class="side-drawer">
        <div class="drawer-content">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
                <p style="font-size:16px;font-weight:800">🏆 Leaderboard</p>
                <button class="btn-icon" onclick="closeLB()">✕</button>
            </div>
            <div id="nameEntrySection">
                <p style="font-size:11px;font-weight:700;color:#52525b;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px">Enter your name to save your score</p>
                <div style="display:flex;gap:8px">
                    <input type="text" id="lbNameInput" class="dark-input" placeholder="Your name..." maxlength="20" style="flex:1;font-size:13px;padding:10px 12px">
                    <button class="btn btn-green" style="padding:10px 16px;font-size:13px" onclick="saveScore()">Save</button>
                </div>
            </div>
            <div class="lb-tabs" id="lbTabs"></div>
            <div class="lb-meta" id="lbMeta"></div>
            <div style="border-radius:12px;border:1px solid #1c1c1f;overflow:hidden;background:#111113">
                <table class="lb-table">
                    <thead><tr><th>#</th><th>Player</th><th style="text-align:right">Best Streak</th></tr></thead>
                    <tbody id="lbBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app">
        <div id="topbar">
            <a href="/" style="font-size:13px;font-weight:600;color:#52525b;text-decoration:none">← Home</a>
            <div style="text-align:center">
                <div style="font-size:16px;font-weight:900;letter-spacing:0.03em">MLB GUESSR</div>
                <div id="eraChips" style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:4px"></div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
                <div class="streak-pill">🔥 <span id="streakVal">0</span></div>
                <button class="btn-icon" onclick="openLB()" title="Leaderboard">🏆</button>
            </div>
        </div>

        <div id="statsArea">
            <div style="padding:8px 4px 6px;display:flex;align-items:center;justify-content:space-between">
                <p style="font-size:10px;font-weight:700;color:#3f3f46;text-transform:uppercase;letter-spacing:0.08em">Career Stats</p>
                <p id="playerNameDisplay">— — —</p>
            </div>
            <div style="position:sticky;top:0;z-index:40;background:#0d0d0f;padding:8px 0 6px;border-bottom:1px solid #1c1c1f;margin-bottom:8px">
                <div id="hintBadges" style="display:flex;gap:6px;flex-wrap:wrap;min-height:26px"></div>
            </div>
            <div style="border-radius:14px;border:1px solid #1c1c1f;overflow:hidden;background:#111113">
                <div style="overflow-x:auto">
                    <table class="stat-table">
                        <thead id="statsHead"></thead>
                        <tbody id="seasonsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="guessPanel">
            <div id="attemptDots" style="display:flex;gap:6px;justify-content:center;margin-bottom:10px"></div>
            <div id="resultBanner" class="banner" style="display:none;margin-bottom:10px"></div>
            <div style="position:relative;margin-bottom:10px">
                <input type="text" id="guessInput" class="dark-input" placeholder="Search player name...">
                <div id="suggestions" class="hidden"></div>
            </div>
            <div style="display:flex;gap:10px">
                <button id="submitBtn" class="btn btn-green" style="flex:1">Submit Guess</button>
                <button id="giveUpBtn" class="btn btn-dim" style="flex:0 0 auto;padding:12px 14px">Give Up</button>
                <button id="nextBtn"   class="btn btn-dim" style="flex:1;display:none">Next Player →</button>
            </div>
        </div>
    </div>

    <script>
    // ══════════════════════════════════════════════════════════════
    // LEADERBOARD
    // ══════════════════════════════════════════════════════════════
    const LB_NAME_KEY = 'nba_lb_name';

    function lbCategoryKey(start, end, types, maxG) {
        return `mlb_${start}-${end}_${types}_${maxG}g`;
    }
    function lbCategoryLabel(key) {
        const m = key.match(/^mlb_(\d+)-(\d+)_(.+)_(\d+)g$/);
        if (!m) return key;
        const [, start, end, types, maxG] = m;
        const tl = {hitters:'Hitters', pitchers:'Pitchers'}[types] || types;
        return `MLB ${start}–${end} · ${tl} · ${maxG} guess${maxG==='1'?'':'es'}`;
    }
    function lbShortLabel(key) {
        const m = key.match(/^mlb_(\d+)-(\d+)_(.+)_(\d+)g$/);
        if (!m) return key;
        const [, start, end, types, maxG] = m;
        const ts = {hitters:'Hit', pitchers:'Pit'}[types] || types;
        return `${start}–${end} · ${ts} · ${maxG}G`;
    }
    function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    let gameToken = null;

    async function recordWin(catKey, name, currentStreak) {
        try { await fetch('/leaderboard', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, category:catKey, streak:currentStreak, game_token: gameToken || ''}) }); }
        catch(e) { console.warn('LB save failed', e); }
    }

    const lbKnownKeys = new Set();
    async function renderLB(activeKey) {
        const currentKey = lbCategoryKey(activeSeason.start, activeSeason.end, activeTypes, maxGuesses);
        lbKnownKeys.add(activeKey); lbKnownKeys.add(currentKey);
        document.getElementById('lbTabs').innerHTML = [...lbKnownKeys].map(k =>
            `<button class="lb-tab${k===activeKey?' active':''}" onclick="renderLB('${k}')">${lbShortLabel(k)}${k===currentKey?' ●':''}</button>`
        ).join('');
        document.getElementById('lbMeta').textContent = lbCategoryLabel(activeKey);
        const tbody = document.getElementById('lbBody');
        tbody.innerHTML = `<tr><td colspan="3"><div class="lb-empty">Loading…</div></td></tr>`;
        try {
            const res = await fetch(`/leaderboard?category=${encodeURIComponent(activeKey)}`);
            const entries = await res.json();
            const savedName = localStorage.getItem(LB_NAME_KEY) || '';
            if (!entries.length) { tbody.innerHTML = `<tr><td colspan="3"><div class="lb-empty">No scores yet. Win a round!</div></td></tr>`; return; }
            tbody.innerHTML = entries.map((e,i) => {
                const isYou = savedName && e.name.toLowerCase()===savedName.toLowerCase();
                const rc = i===0?'rank-gold':i===1?'rank-silver':i===2?'rank-bronze':'';
                const re = i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}`;
                return `<tr class="${isYou?'you-row':''}"><td class="rank ${rc}">${re}</td><td class="name-cell">${escHtml(e.name)}${isYou?' <span style="font-size:10px;color:#52525b">(you)</span>':''}</td><td class="score-cell">${e.best_streak} 🔥</td></tr>`;
            }).join('');
        } catch(e) { tbody.innerHTML = `<tr><td colspan="3"><div class="lb-empty" style="color:#f87171">Failed to load.</div></td></tr>`; }
    }

    let pendingScoreKey = null, pendingStreak = 0;

    async function openLB(showNameEntry=false) {
        const currentKey = lbCategoryKey(activeSeason.start, activeSeason.end, activeTypes, maxGuesses);
        const ns = document.getElementById('nameEntrySection');
        const savedName = localStorage.getItem(LB_NAME_KEY) || '';
        if (showNameEntry && pendingScoreKey) {
            if (savedName) { await recordWin(pendingScoreKey, savedName, pendingStreak); pendingScoreKey=null; ns.classList.remove('visible'); }
            else { ns.classList.add('visible'); document.getElementById('lbNameInput').value=''; setTimeout(()=>document.getElementById('lbNameInput').focus(),350); }
        } else { ns.classList.remove('visible'); }
        document.getElementById('lbDrawer').classList.add('open');
        renderLB(currentKey);
    }
    function closeLB() { document.getElementById('lbDrawer').classList.remove('open'); }
    async function saveScore() {
        const rawName = document.getElementById('lbNameInput').value.trim();
        if (!rawName) { document.getElementById('lbNameInput').style.borderColor='#ef4444'; setTimeout(()=>document.getElementById('lbNameInput').style.borderColor='',800); return; }
        localStorage.setItem(LB_NAME_KEY, rawName);
        if (pendingScoreKey) { await recordWin(pendingScoreKey, rawName, pendingStreak); pendingScoreKey=null; }
        document.getElementById('nameEntrySection').classList.remove('visible');
        renderLB(lbCategoryKey(activeSeason.start, activeSeason.end, activeTypes, maxGuesses));
    }
    document.getElementById('lbDrawer').addEventListener('click', e => { if(e.target===document.getElementById('lbDrawer')) closeLB(); });

    async function maybeOpenLB() {
        const catKey = lbCategoryKey(activeSeason.start, activeSeason.end, activeTypes, maxGuesses);
        try {
            const res = await fetch(`/leaderboard?category=${encodeURIComponent(catKey)}`);
            const entries = await res.json();
            const qualifies = entries.length < 10 || streak > entries[entries.length-1].best_streak;
            if (qualifies) openLB(false);
        } catch(e) {}
    }

    // ══════════════════════════════════════════════════════════════
    // GAME STATE
    // ══════════════════════════════════════════════════════════════
    let currentPlayerName = "";
    let streak     = parseInt(localStorage.getItem('mlb_guessr_cur')  || '0');
    let bestStreak = parseInt(localStorage.getItem('mlb_guessr_best') || '0');
    let allPlayers = [];
    let guessesUsed = 0;
    let roundOver   = false;

    const urlParams  = new URLSearchParams(window.location.search);
    let maxGuesses   = parseInt(urlParams.get('max_guesses') || '2');
    let activeTypes  = document.getElementById('types').value.trim();

    // ── ERA CHIPS ────────────────────────────────────────────────
    const MLB_ERAS = [
        { label:'1900s', start:1900, end:1919 },
        { label:'20s–40s', start:1920, end:1949 },
        { label:'50s–60s', start:1950, end:1969 },
        { label:'70s–80s', start:1970, end:1989 },
        { label:'90s',   start:1990, end:1999 },
        { label:'2000s', start:2000, end:2009 },
        { label:'2010s', start:2010, end:2019 },
        { label:'2020s', start:2020, end:2024 },
        { label:'All Time', start:1871, end:2024 },
    ];

    const _urlStart = parseInt(document.getElementById('startSeason').value);
    const _urlEnd   = parseInt(document.getElementById('endSeason').value);

    function eraFromRange(start, end) {
        if (start <= 1900 && end >= 2024) return [MLB_ERAS[MLB_ERAS.length-1]];
        return MLB_ERAS.filter(e => e.start >= start && e.end <= end && e.label !== 'All Time');
    }

    let selectedEras = eraFromRange(_urlStart, _urlEnd);
    if (!selectedEras.length) selectedEras = [MLB_ERAS[MLB_ERAS.length-1]];

    function getActiveSeason() {
        const start = Math.min(...selectedEras.map(e => e.start));
        const end   = Math.max(...selectedEras.map(e => e.end));
        return { start, end };
    }
    let activeSeason = getActiveSeason();

    function buildEraChips() {
        const chips = document.getElementById('eraChips');
        if (!chips) return;
        chips.innerHTML = MLB_ERAS.map((era, i) => {
            const on = selectedEras.some(e => e.label === era.label);
            return `<button class="era-chip-game${on?' on':''}" data-idx="${i}">${era.label}</button>`;
        }).join('');
        chips.querySelectorAll('.era-chip-game').forEach((btn, i) => {
            btn.addEventListener('click', () => toggleEraGame(i));
        });
    }

    function toggleEraGame(idx) {
        const allTimeIdx = MLB_ERAS.length - 1;
        if (idx === allTimeIdx) {
            selectedEras = [MLB_ERAS[allTimeIdx]];
        } else {
            const era = MLB_ERAS[idx];
            const on  = selectedEras.some(e => e.label === era.label);
            if (on) { selectedEras = selectedEras.filter(e => e.label !== era.label); }
            else { selectedEras = selectedEras.filter(e => e.label !== MLB_ERAS[allTimeIdx].label); selectedEras.push(era); }
            if (!selectedEras.length) selectedEras = [era];
        }
        activeSeason = getActiveSeason();
        buildEraChips();
        loadPlayer();
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('streakVal').textContent = streak;
        buildEraChips();
    });

    fetch(`/mlb/all_players?types=${activeTypes}`).then(r=>r.json()).then(d=>allPlayers=d);

    // ── Helpers ──────────────────────────────────────────────────
    function fmt(v, dec=0) {
        if (v===null||v===undefined) return '—';
        if (dec > 0) return parseFloat(v).toFixed(dec);
        return v;
    }
    function fmtAvg(v) {
        if (v===null||v===undefined) return '—';
        const f = parseFloat(v);
        return isNaN(f) ? '—' : f.toFixed(3).replace(/^0/, '');
    }

    function buildTableHeaders(types) {
        const head = document.getElementById('statsHead');
        if (types === 'pitchers') {
            head.innerHTML = `<tr><th>Year</th><th>Team</th><th>W</th><th>L</th><th>G</th><th>GS</th><th>SV</th><th>IP</th><th>H</th><th>BB</th><th>SO</th><th>ERA</th><th>WHIP</th></tr>`;
        } else {
            head.innerHTML = `<tr><th>Year</th><th>Team</th><th>G</th><th>AB</th><th>R</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>RBI</th><th>BB</th><th>SO</th><th>SB</th><th>AVG</th><th>OBP</th><th>SLG</th></tr>`;
        }
    }

    function buildRow(s, types) {
        if (types === 'pitchers') {
            return `<tr>
                <td class="yr">${fmt(s.season)}</td><td class="tm">${fmt(s.team)}</td>
                <td>${fmt(s.W)}</td><td>${fmt(s.L)}</td><td>${fmt(s.G)}</td>
                <td>${fmt(s.GS)}</td><td>${fmt(s.SV)}</td><td class="hi">${fmt(s.IP,1)}</td>
                <td>${fmt(s.H)}</td><td>${fmt(s.BB)}</td><td>${fmt(s.SO)}</td>
                <td class="hi">${fmt(s.ERA,2)}</td><td>${fmt(s.WHIP,2)}</td>
            </tr>`;
        } else {
            return `<tr>
                <td class="yr">${fmt(s.season)}</td><td class="tm">${fmt(s.team)}</td>
                <td>${fmt(s.G)}</td><td>${fmt(s.AB)}</td><td>${fmt(s.R)}</td>
                <td>${fmt(s.H)}</td><td>${fmt(s["2B"])}</td><td>${fmt(s["3B"])}</td>
                <td>${fmt(s.HR)}</td><td class="hi">${fmt(s.RBI)}</td>
                <td>${fmt(s.BB)}</td><td>${fmt(s.SO)}</td><td>${fmt(s.SB)}</td>
                <td class="hi">${fmtAvg(s.AVG)}</td><td>${fmtAvg(s.OBP)}</td><td>${fmtAvg(s.SLG)}</td>
            </tr>`;
        }
    }

    function buildDots() {
        document.getElementById('attemptDots').innerHTML =
            Array.from({length:maxGuesses},(_,i)=>`<span class="attempt-dot" id="dot-${i}"></span>`).join('');
    }
    function markDot(i, correct) { const d=document.getElementById(`dot-${i}`); if(d) d.classList.add(correct?'used-right':'used-wrong'); }
    function showBanner(text, type) { const b=document.getElementById('resultBanner'); b.textContent=text; b.className=`banner banner-${type}`; b.style.display='block'; }
    function hideBanner() { document.getElementById('resultBanner').style.display='none'; }

    function resetUI() {
        guessesUsed=0; roundOver=false; currentPlayerName='';
        document.getElementById('playerNameDisplay').textContent='— — —';
        document.getElementById('playerNameDisplay').style.color='#3f3f46';
        document.getElementById('hintBadges').innerHTML='';
        document.getElementById('guessInput').value='';
        document.getElementById('suggestions').classList.add('hidden');
        hideBanner();
        document.getElementById('submitBtn').style.display='block';
        document.getElementById('giveUpBtn').style.display='block';
        document.getElementById('giveUpBtn').textContent='Give Up';
        document.getElementById('giveUpBtn').style.background='';
        document.getElementById('giveUpBtn').style.color='';
        document.getElementById('nextBtn').style.display='none';
        buildDots();
        buildTableHeaders(activeTypes);
    }

    async function loadPlayer() {
        resetUI();
        gameToken = null;
        const tbody = document.getElementById('seasonsBody');
        tbody.innerHTML = Array(4).fill(
            `<tr>${Array(10).fill('<td><span class="skeleton"></span></td>').join('')}</tr>`
        ).join('');
        try {
            const res = await fetch(`/mlb/random_player?start_season=${activeSeason.start}&end_season=${activeSeason.end}&types=${activeTypes}`);
            if (!res.ok) { const e=await res.json(); throw new Error(e.error||'Server error'); }
            const data = await res.json();
            currentPlayerName = data.player_name;
            try {
                const tr = await fetch('/game/start?category=mlb');
                if (tr.ok) { const td = await tr.json(); gameToken = td.game_token; }
            } catch (_) {}

            const badges = document.getElementById('hintBadges');
            badges.innerHTML = '';
            const bs  = 'display:inline-flex;align-items:center;gap:4px;background:#18181b;border:1px solid #27272a;border-radius:6px;padding:4px 9px;font-size:11px;font-weight:700;color:#71717a';
            const bsY = bs+';border-color:#854d0e;color:#fbbf24';
            const bsG = bs+';border-color:#166534;color:#4ade80';
            const bsB = bs+';border-color:#1e3a5f;color:#60a5fa';

            if (data.bats)     badges.innerHTML += `<span style="${bs}">🏏 Bats: ${data.bats}</span>`;
            if (data.throws)   badges.innerHTML += `<span style="${bs}">💪 Throws: ${data.throws}</span>`;
            if (data.height)   badges.innerHTML += `<span style="${bs}">📏 ${data.height}</span>`;
            if (!data.is_pitcher && data.position)
                               badges.innerHTML += `<span style="${bs}">🧤 ${data.position}</span>`;

            const aw = data.awards || {};
            if (aw.hof)            badges.innerHTML += `<span style="${bsY}">🏆 HOF</span>`;
            if (aw.mvp > 0)        badges.innerHTML += `<span style="${bsY}">👑 ${aw.mvp}× MVP</span>`;
            if (aw.cy_young > 0)   badges.innerHTML += `<span style="${bsG}">🎯 ${aw.cy_young}× Cy Young</span>`;
            if (aw.roy > 0)        badges.innerHTML += `<span style="${bsB}">🌱 ${aw.roy}× ROY</span>`;
            if (aw.allstar > 0)    badges.innerHTML += `<span style="${bsB}">⭐ ${aw.allstar}× All-Star</span>`;
            if (aw.gold_glove > 0) badges.innerHTML += `<span style="${bsG}">🧤 ${aw.gold_glove}× Gold Glove</span>`;
            if (aw.silver_slugger > 0) badges.innerHTML += `<span style="${bsB}">🔨 ${aw.silver_slugger}× Silver Slugger</span>`;

            tbody.innerHTML = '';
            data.seasons.forEach(s => {
                tbody.insertAdjacentHTML('beforeend', buildRow(s, activeTypes));
            });
        } catch(err) {
            tbody.innerHTML = `<tr><td colspan="16" style="padding:20px;text-align:center;color:#f87171;font-weight:600">${err.message}</td></tr>`;
        }
    }

    // ── Submit ───────────────────────────────────────────────────
    document.getElementById('submitBtn').addEventListener('click', () => {
        if (roundOver||!currentPlayerName) return;
        const guess = document.getElementById('guessInput').value.trim();
        if (!allPlayers.some(p=>norm(p)===norm(guess))) {
            const inp=document.getElementById('guessInput');
            inp.style.borderColor='#ef4444';
            setTimeout(()=>inp.style.borderColor='',800);
            return;
        }
        const correct = guess.toLowerCase()===currentPlayerName.toLowerCase();
        markDot(guessesUsed, correct);
        guessesUsed++;

        if (correct) {
            streak++;
            if (streak>bestStreak){bestStreak=streak;localStorage.setItem('mlb_guessr_best',bestStreak);}
            localStorage.setItem('mlb_guessr_cur',streak);
            const el=document.getElementById('streakVal');
            el.textContent=streak; el.classList.remove('score-pop'); void el.offsetWidth; el.classList.add('score-pop');
            document.getElementById('playerNameDisplay').textContent=currentPlayerName;
            document.getElementById('playerNameDisplay').style.color='#4ade80';
            showBanner(`✓ ${currentPlayerName} — Streak: ${streak} (Best: ${bestStreak})`,'ok');
            const catKey=lbCategoryKey(activeSeason.start,activeSeason.end,activeTypes,maxGuesses);
            const savedName=localStorage.getItem(LB_NAME_KEY)||'';
            if (savedName) { recordWin(catKey,savedName,streak); }
            else { pendingScoreKey=catKey; pendingStreak=streak; }
            endRound(true);
        } else {
            const left=maxGuesses-guessesUsed;
            if (left>0) {
                showBanner(`✗ Not ${guess||'?'} — ${left} guess${left>1?'es':''} left`,'hint');
                document.getElementById('guessInput').value='';
            } else {
                streak=0; localStorage.setItem('mlb_guessr_cur',0);
                document.getElementById('streakVal').textContent=0;
                document.getElementById('playerNameDisplay').textContent=currentPlayerName;
                document.getElementById('playerNameDisplay').style.color='#f87171';
                showBanner(`✗ It was ${currentPlayerName} — Best: ${bestStreak}`,'err');
                endRound(false);
            }
        }
    });

    function endRound(won) {
        roundOver=true;
        document.getElementById('submitBtn').style.display='none';
        document.getElementById('giveUpBtn').style.display='none';
        document.getElementById('nextBtn').style.display='block';
        document.getElementById('guessInput').value='';
        document.getElementById('suggestions').classList.add('hidden');
        if (!won && streak > 0) setTimeout(()=>maybeOpenLB(), 600);
    }

    // ── Give Up ──────────────────────────────────────────────────
    let giveUpPrimed = false;
    document.getElementById('giveUpBtn').addEventListener('click', () => {
        if (roundOver||!currentPlayerName) return;
        if (!giveUpPrimed) {
            giveUpPrimed=true;
            const btn=document.getElementById('giveUpBtn');
            btn.textContent='Sure?'; btn.style.background='#7f1d1d'; btn.style.color='#f87171';
            setTimeout(()=>{ if(giveUpPrimed){ giveUpPrimed=false; btn.textContent='Give Up'; btn.style.background=''; btn.style.color=''; } },3000);
        } else {
            giveUpPrimed=false;
            streak=0; localStorage.setItem('mlb_guessr_cur',0);
            document.getElementById('streakVal').textContent=0;
            document.getElementById('playerNameDisplay').textContent=currentPlayerName;
            document.getElementById('playerNameDisplay').style.color='#f87171';
            showBanner(`🏳️ ${currentPlayerName} — you gave up. Best: ${bestStreak}`,'err');
            endRound(false);
        }
    });
    document.getElementById('guessInput').addEventListener('input', () => {
        if (giveUpPrimed) { giveUpPrimed=false; const btn=document.getElementById('giveUpBtn'); btn.textContent='Give Up'; btn.style.background=''; btn.style.color=''; }
    });

    // ── Autocomplete ─────────────────────────────────────────────
    const input = document.getElementById('guessInput');
    const suggs = document.getElementById('suggestions');

    function norm(s) { return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }

    function matchPlayers(players, val) {
        const q=norm(val.trim());
        if(q.length<2) return [];
        const last=[],first=[],full=[];
        players.forEach(p=>{
            const np=norm(p),parts=np.split(' ');
            const fn=parts[0]||'',ln=parts.slice(1).join(' ')||'';
            if(ln.startsWith(q)) last.push(p);
            else if(fn.startsWith(q)) first.push(p);
            else if(np.startsWith(q)||np.replace(/\s+/g,'').includes(q.replace(/\s+/g,''))) full.push(p);
        });
        return [...last,...first,...full];
    }

    input.addEventListener('input', () => {
        const matches=matchPlayers(allPlayers,input.value);
        if(!matches.length){suggs.classList.add('hidden');return;}
        suggs.innerHTML=matches.map((m,i)=>`<div class="sug-item" data-idx="${i}">${escHtml(m)}</div>`).join('');
        suggs._matches=matches;
        suggs.classList.remove('hidden');
    });
    suggs.addEventListener('click', e=>{
        const item=e.target.closest('.sug-item');
        if(!item) return;
        input.value=suggs._matches[parseInt(item.dataset.idx)];
        suggs.classList.add('hidden');
    });
    document.addEventListener('click', e=>{
        if(!e.target.closest('#guessInput')&&!e.target.closest('#suggestions')) suggs.classList.add('hidden');
    });

    // ── Init ─────────────────────────────────────────────────────
    document.getElementById('nextBtn').addEventListener('click', loadPlayer);
    window.onload = loadPlayer;
    </script>
</body>
</html>
